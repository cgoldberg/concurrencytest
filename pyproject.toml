[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "concurrencytest"
version = "0.1.12"
description = "Run unittest test suites concurrently"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Corey Goldberg"}]
maintainers = [{name = "Corey Goldberg"}]
readme = "README.md"
requires-python = ">= 3.10"
keywords = ["test", "testing", "testtools", "unittest", "concurrency", "parallel"]
classifiers = [
        "Intended Audience :: Developers",
        "Intended Audience :: Information Technology",
        "Operating System :: POSIX",
        "Operating System :: Unix",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: Software Development :: Testing",
]
dependencies = [
    "python-subunit>=1.4.6",
    "testtools>=2.9.1",
]

[project.urls]
homepage = "https://github.com/cgoldberg/concurrencytest"
source = "https://github.com/cgoldberg/concurrencytest"
download = "https://pypi.org/project/concurrencytest"

[dependency-groups]
lint = [
    "ruff==0.17.4",
]
type = [
    "mypy==2.4.1",
]
validate = [
    "validate-pyproject[all]==0.27",
]

[tool.setuptools]
py-modules = ["concurrencytest"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
respect-gitignore = true
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "BLE001", "COM812", "D",
    "N802", "PT", "SLF", "T201"
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR2004", "PT", "SIM117"]
"**/*_tests.py" = ["EM101", "FBT003", "TRY002"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
